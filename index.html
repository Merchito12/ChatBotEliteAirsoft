<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Airsoft | Asistente virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg-dark:#232527;
  --color-bg-secondary:#2C2D2D;
  --color-text-light:#D8D2C2;
  --color-white:#FFFFFF;
  --color-accent:#A78D66;
  --color-accent-secondary:#A68A67;
  --color-red:#BE2126;
  --font-family:'Oswald',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font-family);
  color:var(--color-text-light);
  background:var(--color-bg-dark);
  min-height:100vh;
  background-image:
    linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.78)),
    radial-gradient(900px 500px at 78% 20%,rgba(167,141,102,.16),transparent 60%),
    radial-gradient(700px 500px at 10% 90%,rgba(190,33,38,.10),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px);
  background-attachment:fixed;
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:18px 32px;
  background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.35));
  backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(216,210,194,.10);
  position:sticky;top:0;z-index:5;
}
.logo{
  font-weight:700;font-size:34px;line-height:.9;text-transform:uppercase;letter-spacing:.05em;
  color:var(--color-text-light);text-decoration:none;
  text-shadow:0 2px 0 rgba(0,0,0,.6);
}
.logo img{display:block;height:56px;width:auto}
.logo small{display:block;font-size:12px;font-weight:500;letter-spacing:.4em;color:var(--color-accent);text-align:center;margin-top:4px}
nav{display:flex;gap:28px;flex-wrap:wrap}
nav a{
  color:var(--color-accent);text-decoration:none;font-weight:500;font-size:18px;letter-spacing:.02em;
  padding:4px 0;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
}
nav a:hover{color:var(--color-text-light)}
nav a.active{border-bottom-color:var(--color-red);color:var(--color-text-light)}
main{
  max-width:1100px;margin:0 auto;padding:24px 20px;
  min-height:calc(100vh - 92px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
}
.hero{text-align:center}
h1{
  margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:clamp(28px,4.5vw,48px);line-height:1.08;color:var(--color-white);text-wrap:balance;
}
.hero p{
  margin:8px auto 0;max-width:620px;font-size:clamp(15px,1.6vw,18px);font-weight:400;line-height:1.5;color:var(--color-text-light);
}
.chat-wrap{
  width:100%;max-width:900px;height:min(640px,calc(100vh - 330px));min-height:420px;
  border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 1px rgba(216,210,194,.12),0 0 80px rgba(167,141,102,.10);
}
#chat{display:block;width:100%;height:100%}
.btn{
  background:var(--color-accent);color:var(--color-bg-dark);
  font-family:var(--font-family);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;
  border:0;border-radius:12px;padding:12px 24px;text-decoration:none;
  box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .15s,filter .15s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.wa{
  position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(35,37,39,.9);border:2px solid rgba(216,210,194,.35);box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.wa svg{width:30px;height:30px;fill:var(--color-text-light)}
@media (max-width:640px){
  header{padding:14px 16px}
  nav{gap:16px}nav a{font-size:15px}
  .logo img{height:42px}
  .chat-wrap{height:calc(100vh - 300px);min-height:400px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>

.fab{position:fixed;bottom:20px;" + cfg.position + ":20px;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:" + cfg.accent + ";color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:transform .15s}\
.fab:hover{transform:scale(1.06)}\
.fab svg{width:28px;height:28px;fill:#fff}\
.panel{border-radius:12px;position:fixed;bottom:92px;" + cfg.position + ":20px;width:380px;max-width:calc(100vw - 24px);height:560px;max-height:calc(100dvh - 120px);background:#232527;color:#D8D2C2;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden;border:1px solid rgba(216,210,194,.14)}\
.panel.open{display:flex}\
.head{background:linear-gradient(135deg,#2C2D2D,#232527);padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid " + cfg.accent + "}\
.head .t{font-family:Oswald,system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase}\
.head .s{font-size:12px;color:#a99f88}\
.head .grow{flex:1}\
.icon-btn{background:none;border:0;color:#a99f88;cursor:pointer;font-size:13px;padding:6px 8px;border-radius:6px}\
.icon-btn:hover{color:#fff;background:rgba(255,255,255,.08)}\
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}\
.m{max-width:86%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}\
.m.bot{align-self:flex-start;background:#2C2D2D;border:1px solid rgba(216,210,194,.12);border-bottom-left-radius:4px}\
.m.user{align-self:flex-end;background:" + cfg.accent + ";color:#232527;font-weight:500;border-bottom-right-radius:4px}\
.m.err{align-self:flex-start;background:#3a1a16;color:#ffb4a8;border:1px solid #5a2a22;border-bottom-left-radius:4px}\
.m a{color:#d9bd8c;text-decoration:underline}\
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}\
.chip{background:transparent;border:1px solid " + cfg.accent + ";color:#D8D2C2;border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer}\
.chip:hover{background:" + cfg.accent + ";color:#232527}\
.panel.inline{position:static;display:flex;width:100%;height:100%;max-width:none;max-height:none;box-shadow:0 12px 30px rgba(0,0,0,.35)}\
.panel.inline [data-act=close],.inline ~ .fab{display:none}\
:host(.inl) .fab{display:none}\
.dots{display:inline-flex;gap:4px;padding:2px 0}\
.dots i{width:7px;height:7px;border-radius:50%;background:#a99f88;animation:b 1s infinite}\
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}\
@keyframes b{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}\
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(216,210,194,.14);background:#2C2D2D}\
textarea{flex:1;resize:none;border:1px solid rgba(216,210,194,.2);background:#1b1c1d;color:#D8D2C2;border-radius:12px;padding:9px 12px;font-size:14.5px;max-height:110px;outline:none;font-family:inherit}\
textarea:focus{border-color:" + cfg.accent + "}\
.send{background:" + cfg.accent + ";color:#232527;border:0;border-radius:12px;padding:0 20px;font-family:Oswald,system-ui,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;font-size:14px}\
.send:disabled{opacity:.5;cursor:not-allowed}\
.foot{font-size:10.5px;text-align:center;color:#8a8372;padding:0 0 6px;background:#2C2D2D}\
@media(max-width:480px){.panel{width:calc(100vw - 16px);" + cfg.position + ":8px;bottom:84px;height:calc(100dvh - 100px)}}";

  root.innerHTML = "<style>" + css + "</style>\
<button class='fab' aria-label='Abrir chat'><svg viewBox='0 0 24 24'><path d='M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z'/></svg></button>\
<section class='panel" + (INLINE ? " inline open" : "") + "' role='dialog' aria-label='Chat de Elite Airsoft'>\
 <div class='head'><div><div class='t'></div><div class='s'></div></div><div class='grow'></div>\
  <button class='icon-btn' data-act='reset' title='Nueva conversación'>Nueva</button>\
  <button class='icon-btn' data-act='close' title='Cerrar'>&#10005;</button></div>\
 <div class='log' aria-live='polite'></div>\
 <form><textarea rows='1' placeholder='Escribe tu pregunta...' maxlength='1000'></textarea><button class='send' type='submit'>Enviar</button></form>\
 <div class='foot'>Las respuestas son informativas. La disponibilidad la confirma el equipo por WhatsApp.</div>\
</section>";

  var $ = function (s) { return root.querySelector(s); };
  var fab = $(".fab"), panel = $(".panel"), log = $(".log"), form = $("form"),
      input = $("textarea"), sendBtn = $(".send");
  $(".t").textContent = cfg.title;
  $(".s").textContent = cfg.subtitle;

  function linkify(el, text) {
    el.textContent = "";
    var re = /(https?:\/\/[^\s)]+)/g, last = 0, m;
    while ((m = re.exec(text)) !== null) {
      el.appendChild(document.createTextNode(text.slice(last, m.index)));
      var url = m[1].replace(/[.,;]+$/, "");
      var a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = url;
      el.appendChild(a);
      last = m.index + m[1].length - (m[1].length - url.length);
      re.lastIndex = last;
    }
    el.appendChild(document.createTextNode(text.slice(last)));
  }
  function clean(t) {
    return String(t).replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#{1,6}\s*/gm, "").replace(/^\s*[-*]\s+/gm, "- ");
  }
  function add(text, cls) {
    var d = document.createElement("div");
    d.className = "m " + cls;
    if (cls === "bot") linkify(d, clean(text)); else d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function addChips() {
    var w = document.createElement("div");
    w.className = "chips";
    CHIPS.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = c;
      b.addEventListener("click", function () { w.remove(); ask(c); });
      w.appendChild(b);
    });
    log.appendChild(w);
  }
  function start() {
    log.innerHTML = "";
    add(GREETING, "bot");
    addChips();
  }

  var busy = false;
  async function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    var chips = log.querySelector(".chips"); if (chips) chips.remove();
    add(text, "user");
    busy = true; sendBtn.disabled = true;
    var b = document.createElement("div");
    b.className = "m bot"; b.innerHTML = "<span class='dots'><i></i><i></i><i></i></span>";
    log.appendChild(b); log.scrollTop = log.scrollHeight;
    try {
      if (!cfg.webhook) throw new Error("Falta configurar data-webhook en el script del chatbot.");
      var ctrl = new AbortController();
      var to = setTimeout(function () { ctrl.abort(); }, 60000);
      var res = await fetch(cfg.webhook, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId: sessionId, chatInput: text }), signal: ctrl.signal
      });
      clearTimeout(to);
      if (!res.ok) throw new Error("El servicio respondió con el código " + res.status + ".");
      var data = await res.json();
      var out = Array.isArray(data) ? data[0] : data;
      var answer = (out && (out.output || out.text || out.response)) || "No pude generar una respuesta. Intenta de nuevo.";
      b.className = "m bot"; linkify(b, clean(answer));
    } catch (e) {
      b.className = "m err";
      b.textContent = e.name === "AbortError" ? "La respuesta tardó demasiado. Intenta de nuevo."
        : (e.message && e.message.indexOf("Failed to fetch") > -1) ? "No se pudo conectar con el asistente. Intenta de nuevo en unos minutos."
        : (e.message || "Ocurrió un error.");
    } finally {
      busy = false; sendBtn.disabled = false; log.scrollTop = log.scrollHeight; input.focus();
    }
  }

  function toggle(open) {
    var willOpen = open === undefined ? !panel.classList.contains("open") : open;
    panel.classList.toggle("open", willOpen);
    if (willOpen) { if (!log.children.length) start(); setTimeout(function () { input.focus(); }, 50); }
  }
  fab.addEventListener("click", function () { toggle(); });
  root.querySelector("[data-act=close]").addEventListener("click", function () { toggle(false); });
  root.querySelector("[data-act=reset]").addEventListener("click", function () {
    sessionId = uid(); store("elite_chat_sid", sessionId); start();
  });
  form.addEventListener("submit", function (e) { e.preventDefault(); var t = input.value; input.value = ""; input.style.height = "auto"; ask(t); });
  input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  input.addEventListener("input", function () { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 110) + "px"; });

  if (INLINE) { fab.style.display = "none"; root.querySelector("[data-act=close]").style.display = "none"; toggle(true); }
  window.EliteChatbot = { open: function () { toggle(true); }, close: function () { toggle(false); } };
})();

</script>
</body>
</html>
