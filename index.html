<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Airsoft | Asistente virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-bg-dark:#232527;
  --color-bg-secondary:#2C2D2D;
  --color-text-light:#D8D2C2;
  --color-white:#FFFFFF;
  --color-accent:#A78D66;
  --color-accent-secondary:#A68A67;
  --color-red:#BE2126;
  --font-family:'Oswald',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font-family);
  color:var(--color-text-light);
  background:var(--color-bg-dark);
  min-height:100vh;
  background-image:
    linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.78)),
    radial-gradient(900px 500px at 78% 20%,rgba(167,141,102,.16),transparent 60%),
    radial-gradient(700px 500px at 10% 90%,rgba(190,33,38,.10),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px);
  background-attachment:fixed;
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:18px 32px;
  background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.35));
  backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(216,210,194,.10);
  position:sticky;top:0;z-index:5;
}
.logo{
  font-weight:700;font-size:34px;line-height:.9;text-transform:uppercase;letter-spacing:.05em;
  color:var(--color-text-light);text-decoration:none;
  text-shadow:0 2px 0 rgba(0,0,0,.6);
}
.logo small{display:block;font-size:12px;font-weight:500;letter-spacing:.4em;color:var(--color-accent);text-align:center;margin-top:4px}
nav{display:flex;gap:28px;flex-wrap:wrap}
nav a{
  color:var(--color-accent);text-decoration:none;font-weight:500;font-size:18px;letter-spacing:.02em;
  padding:4px 0;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
}
nav a:hover{color:var(--color-text-light)}
nav a.active{border-bottom-color:var(--color-red);color:var(--color-text-light)}
main{
  max-width:1000px;margin:0 auto;padding:clamp(28px,6vh,64px) 20px 48px;
  display:flex;flex-direction:column;align-items:center;gap:28px;
}
.hero{text-align:center}
h1{
  margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:clamp(34px,6vw,64px);line-height:1.08;color:var(--color-white);text-wrap:balance;
}
.hero p{
  margin:12px auto 0;max-width:620px;font-size:clamp(16px,2vw,20px);font-weight:400;line-height:1.5;color:var(--color-text-light);
}
.chat-wrap{
  width:100%;max-width:760px;height:min(620px,calc(100vh - 350px));min-height:460px;
  border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.45),0 0 0 1px rgba(216,210,194,.12),0 0 80px rgba(167,141,102,.10);
}
#chat{display:block;width:100%;height:100%}
.btn{
  background:var(--color-accent);color:var(--color-bg-dark);
  font-family:var(--font-family);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;
  border:0;border-radius:12px;padding:12px 24px;text-decoration:none;
  box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .15s,filter .15s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.wa{
  position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(35,37,39,.9);border:2px solid rgba(216,210,194,.35);box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.wa svg{width:30px;height:30px;fill:var(--color-text-light)}
@media (max-width:640px){
  header{padding:14px 16px}
  nav{gap:16px}nav a{font-size:15px}
  .logo{font-size:26px}
  .chat-wrap{height:calc(100vh - 260px);min-height:420px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#">Elite<small>Airsoft</small></a>
  <nav aria-label="Principal">
    <a class="active" href="#">Inicio</a>
    <a href="#">Campos</a>
    <a href="#">Planes</a>
    <a href="#">Sobre nosotros</a>
    <a href="#">Contáctanos</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>Una experiencia única</h1>
    <p>Bienvenido a Elite Airsoft, donde la estrategia, la adrenalina y el trabajo en equipo se convierten en una experiencia inolvidable.</p>
  </section>

  <div class="chat-wrap"><div id="chat"></div></div>

  <a class="btn" href="https://wa.me/573057668729" target="_blank" rel="noopener">Reserva ya</a>
</main>

<a class="wa" href="https://wa.me/573057668729" target="_blank" rel="noopener" aria-label="WhatsApp Elite Airsoft">
  <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8-.2-.1-.4-.1-.6.100l-.8 1c-.1.200-.3.200-.5.100a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.700 11.800 11.800 0 0 0 4.500 4c1.700.7 2.300.8 3.200.7.500-.1 1.500-.6 1.700-1.200s.2-1.100.2-1.200-.2-.2-.4-.3z"/></svg>
</a>

<script src="elite-chatbot-widget.js"
        data-webhook="https://mercho.app.n8n.cloud/webhook/elite-chatbot"
        data-mount="#chat"
        data-title="Elite Airsoft"
        data-subtitle="Asistente virtual"
        defer></script>
</body>
</html>
